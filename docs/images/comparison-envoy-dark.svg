<text fill="#8d96a0" xml:space="preserve"><tspan x="60.06" y="308.55"># yaml-language-server: </tspan><tspan x="76.18" y="328.55">$schema=../../../schema/proxyfile.schema.json</tspan></text>
<text x="48.06" y="348.55" fill="#8d96a0" text-anchor="end">2</text>
<text fill="#8d96a0" xml:space="preserve"><tspan x="60.06" y="348.55"># The smallest proxyfile: one service, one route, and </tspan><tspan x="76.18" y="368.55">the browser origins it admits.</tspan></text>
<text x="48.06" y="388.55" fill="#8d96a0" text-anchor="end">3</text>
<text x="60.06" y="388.55" xml:space="preserve">listen: 8000</text>
<text x="48.06" y="408.55" fill="#8d96a0" text-anchor="end">4</text>
<text x="60.06" y="408.55" xml:space="preserve">services:</text>
<text x="48.06" y="428.55" fill="#8d96a0" text-anchor="end">5</text>
<text x="60.06" y="428.55" xml:space="preserve">  app: {http: 3000}</text>
<text x="48.06" y="448.55" fill="#8d96a0" text-anchor="end">6</text>
<text x="60.06" y="448.55" xml:space="preserve">origins:</text>
<text x="48.06" y="468.55" fill="#8d96a0" text-anchor="end">7</text>
<text xml:space="preserve"><tspan x="60.06" y="468.55">  all: {hosts: [localhost], origins: </tspan><tspan x="92.3" y="488.55">[&#34;http://localhost:3000&#34;]}</tspan></text>
<text x="48.06" y="508.55" fill="#8d96a0" text-anchor="end">8</text>
<text x="60.06" y="508.55" xml:space="preserve">routes:</text>
<text x="48.06" y="528.55" fill="#8d96a0" text-anchor="end">9</text>
<text x="60.06" y="528.55" xml:space="preserve">  - {name: app, prefix: /, to: app}</text>
