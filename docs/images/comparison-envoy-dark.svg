<text x="901.5" y="235.3" xml:space="preserve">              &#34;@type&#34;: type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC</text>
<text x="901.5" y="246.3" xml:space="preserve">          - name: envoy.filters.http.cors</text>
<text x="901.5" y="257.3" xml:space="preserve">            typed_config:</text>
<text x="901.5" y="268.3" xml:space="preserve">              &#34;@type&#34;: type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors</text>
<text x="901.5" y="279.3" xml:space="preserve">          - name: envoy.filters.http.router</text>
