<text x="901.5" y="301.3" xml:space="preserve">              &#34;@type&#34;: type.googleapis.com/envoy.extensions.filters.http.router.v3.Router</text>
<text x="901.5" y="312.3" xml:space="preserve">              suppress_envoy_headers: true</text>
<text x="901.5" y="323.3" xml:space="preserve">          route_config:</text>
<text x="901.5" y="334.3" xml:space="preserve">            name: public</text>
<text x="901.5" y="345.3" xml:space="preserve">            ignore_port_in_host_matching: true</text>
<text x="901.5" y="356.3" xml:space="preserve">            virtual_hosts:</text>
<text x="901.5" y="367.3" xml:space="preserve">            - name: &#34;all&#34;</text>
