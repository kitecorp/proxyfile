<text x="547" y="92.3" fill="#8d96a0" xml:space="preserve"># Generated by proxyfile. Do not edit: change the proxyfile beside it and run proxyfile render; proxyfile check fails on a hand edit.</text>
<text x="547" y="103.3" xml:space="preserve">static_resources:</text>
<text x="547" y="114.3" xml:space="preserve">  listeners:</text>
<text x="547" y="125.3" xml:space="preserve">  - name: public</text>
<text x="547" y="136.3" xml:space="preserve">    address: {socket_address: {address: 0.0.0.0, port_value: 8000}}</text>
<text x="547" y="147.3" xml:space="preserve">    filter_chains:</text>
<text x="547" y="158.3" xml:space="preserve">    - filters:</text>
<text x="547" y="169.3" xml:space="preserve">      - name: envoy.filters.network.http_connection_manager</text>
<text x="547" y="180.3" xml:space="preserve">        typed_config:</text>
<text x="547" y="191.3" xml:space="preserve">          &#34;@type&#34;: type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager</text>
<text x="547" y="202.3" xml:space="preserve">          stat_prefix: public</text>
<text x="547" y="213.3" xml:space="preserve">          use_remote_address: false</text>
<text x="547" y="224.3" xml:space="preserve">          always_set_request_id_in_response: true</text>
<text x="547" y="235.3" xml:space="preserve">          server_header_transformation: PASS_THROUGH</text>
<text x="547" y="246.3" xml:space="preserve">          normalize_path: false</text>
<text x="547" y="257.3" xml:space="preserve">          merge_slashes: false</text>
<text x="547" y="268.3" xml:space="preserve">          upgrade_configs: [{upgrade_type: websocket}]</text>
<text x="547" y="279.3" xml:space="preserve">          local_reply_config:</text>
<text x="547" y="290.3" xml:space="preserve">            mappers:</text>
<text x="547" y="301.3" xml:space="preserve">            - filter: {response_flag_filter: {flags: [UF, UH, UC, URX]}}</text>
<text x="547" y="312.3" xml:space="preserve">              status_code: 502</text>
<text x="547" y="323.3" xml:space="preserve">              body: {inline_string: &#34;&#34;}</text>
<text x="547" y="334.3" xml:space="preserve">            - filter:</text>
<text x="547" y="345.3" xml:space="preserve">                and_filter:</text>
<text x="547" y="356.3" xml:space="preserve">                  filters:</text>
<text x="547" y="367.3" xml:space="preserve">                  - status_code_filter:</text>
<text x="547" y="378.3" xml:space="preserve">                      comparison: {op: EQ, value: {default_value: 403, runtime_key: gateway.local_reply.origin_refused_status}}</text>
<text x="547" y="389.3" xml:space="preserve">                  - header_filter:</text>
<text x="547" y="400.3" xml:space="preserve">                      header: {name: origin, present_match: true}</text>
<text x="547" y="411.3" xml:space="preserve">              body: {inline_string: &#34;Invalid CORS request&#34;}</text>
<text x="547" y="422.3" xml:space="preserve">          access_log:</text>
<text x="547" y="433.3" xml:space="preserve">          - name: envoy.access_loggers.stdout</text>
<text x="547" y="444.3" xml:space="preserve">            typed_config:</text>
<text x="547" y="455.3" xml:space="preserve">              &#34;@type&#34;: type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog</text>
<text x="547" y="466.3" xml:space="preserve">              log_format:</text>
<text x="547" y="477.3" xml:space="preserve">                json_format:</text>
<text x="547" y="488.3" xml:space="preserve">                  time: &#34;%START_TIME%&#34;</text>
<text x="547" y="499.3" xml:space="preserve">                  route: &#34;%ROUTE_NAME%&#34;</text>
<text x="547" y="510.3" xml:space="preserve">                  host: &#34;%REQ(:AUTHORITY)%&#34;</text>
