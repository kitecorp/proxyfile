# yaml-language-server: $schema=../../../schema/proxyfile.schema.json
# Rate limits: the RPC methods of the rpc entry share one limit of 100 calls a second for every client together, and
# login admits each client address 5 requests a minute, with 5 more after a quiet spell. The last route has no limit,
# so a path only it matches, such as /login/, is never limited (docs/routes.md).
# This file writes no tls, so client_address is forwarded: the per-client limit counts the address a proxy in front
# of the gateway puts in X-Forwarded-For. A gateway that faces clients directly writes client_address: connection.
listen: 8000
services:
  shop: {http: 8080, grpc: 8081}
origins:
  all: {hosts: [localhost], origins: ["http://localhost:3000"]}
routes:
  - rpc: {to: {"*": shop}, rate_limit: {requests: 100, per: 1s, by: all}}
  - {name: login, path: /login, method: POST, to: shop, rate_limit: {requests: 5, per: 1m, burst: 5}}
  - {name: shop, prefix: /, to: shop}
rpc:
  methods:
    - {service: example.shop.v1.CartService, method: AddItem}
    - {service: example.shop.v1.CartService, method: GetCart}
