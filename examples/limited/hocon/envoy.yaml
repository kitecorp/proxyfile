# Generated by proxyfile. Do not edit: change the proxyfile beside it and run proxyfile render; proxyfile check fails on a hand edit.
static_resources:
  listeners:
  - name: public
    address: {socket_address: {address: 0.0.0.0, port_value: 8000}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: public
          use_remote_address: false
          always_set_request_id_in_response: true
          server_header_transformation: PASS_THROUGH
          normalize_path: false
          merge_slashes: false
          upgrade_configs: [{upgrade_type: websocket}]
          local_reply_config:
            mappers:
            - filter: {response_flag_filter: {flags: [UF, UH, UC, URX]}}
              status_code: 502
              body: {inline_string: ""}
            - filter:
                and_filter:
                  filters:
                  - status_code_filter:
                      comparison: {op: EQ, value: {default_value: 403, runtime_key: gateway.local_reply.origin_refused_status}}
                  - header_filter:
                      header: {name: origin, present_match: true}
              body: {inline_string: "Invalid CORS request"}
            - filter:
                and_filter:
                  filters:
                  - status_code_filter:
                      comparison: {op: EQ, value: {default_value: 429, runtime_key: gateway.local_reply.rate_limited_status}}
                  - header_filter:
                      header: {name: connect-protocol-version, present_match: true}
              body: {inline_string: '{"code":"resource_exhausted","message":"local_rate_limited"}'}
              body_format_override:
                text_format_source: {inline_string: "%LOCAL_REPLY_BODY%"}
                content_type: application/json
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  time: "%START_TIME%"
                  route: "%ROUTE_NAME%"
                  host: "%REQ(:AUTHORITY)%"
                  method: "%REQ(:METHOD)%"
                  protocol: "%PROTOCOL%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  details: "%RESPONSE_CODE_DETAILS%"
                  duration_ms: "%DURATION%"
                  upstream_ms: "%RESPONSE_DURATION%"
                  bytes_in: "%BYTES_RECEIVED%"
                  bytes_out: "%BYTES_SENT%"
                  upstream: "%UPSTREAM_CLUSTER%"
                  request_id: "%REQ(X-REQUEST-ID)%"
          - name: envoy.access_loggers.stdout
            filter:
              response_flag_filter: {flags: [UH, UF, UO, UC, UT, URX, UPE]}
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  event: gateway_upstream_failure
                  route: "%ROUTE_NAME%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  upstream: "%UPSTREAM_CLUSTER%"
          http_filters:
          - name: envoy.filters.http.header_mutation
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                response_mutations:
                - append:
                    header: {key: vary, value: Origin}
                    append_action: APPEND_IF_EXISTS_OR_ADD
          - name: envoy.filters.http.rbac
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: rate_limit
              filter_enabled: {default_value: {numerator: 100, denominator: HUNDRED}}
              filter_enforced: {default_value: {numerator: 100, denominator: HUNDRED}}
              rate_limited_as_resource_exhausted: true
              always_consume_default_token_bucket: false
              max_dynamic_descriptors: 65536
              rate_limits:
              - actions:
                - metadata: {descriptor_key: bucket, metadata_key: {key: "proxyfile.rate_limit", path: [{key: all}]}, source: ROUTE_ENTRY}
              - actions:
                - metadata: {descriptor_key: bucket, metadata_key: {key: "proxyfile.rate_limit", path: [{key: client}]}, source: ROUTE_ENTRY}
                - remote_address: {}
              descriptors:
              - entries: [{key: bucket, value: "rpc"}]
                token_bucket: {max_tokens: 100, tokens_per_fill: 100, fill_interval: 1s}
              - entries: [{key: bucket, value: "login"}, {key: remote_address}]
                token_bucket: {max_tokens: 10, tokens_per_fill: 5, fill_interval: 60s}
          - name: envoy.filters.http.lua
            disabled: true
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  -- Connect's status today for each code whose status the bridge writes from the old table.
                  local CONNECT_STATUS = {
                    canceled = "499",
                    deadline_exceeded = "504",
                    failed_precondition = "400",
                    unimplemented = "501",
                  }
                  local OLD_STATUS = {["404"] = true, ["408"] = true, ["412"] = true}

                  function envoy_on_response(response_handle)
                    local headers = response_handle:headers()
                    if not OLD_STATUS[headers:get(":status")] or headers:get("content-type") ~= "application/json" then
                      return
                    end
                    local body = response_handle:body()
                    if body == nil then
                      return
                    end
                    -- The bridge writes the error with protobuf's JSON printer: its keys come in no fixed order
                    -- (message before code, as measured), and a quote inside a string is always escaped, so the
                    -- only "code":"..." pair in the body is the error's own.
                    local code = body:getBytes(0, body:length()):match('"code"%s*:%s*"([%l_]+)"')
                    local status = CONNECT_STATUS[code]
                    if status ~= nil then
                      -- Asked for again: the header object from before body() died while the body was awaited.
                      response_handle:headers():replace(":status", status)
                    end
                  end
          - name: envoy.filters.http.connect_grpc_bridge
            disabled: true
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.connect_grpc_bridge.v3.FilterConfig
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: true
          route_config:
            name: public
            ignore_port_in_host_matching: true
            virtual_hosts:
            - name: "all"
              domains: ["localhost"]
              typed_per_filter_config:
                envoy.filters.http.rbac:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        browser-origins:
                          permissions: [{any: true}]
                          principals:
                          - {not_id: {header: {name: origin, present_match: true}}}
                          - {header: {name: origin, string_match: {safe_regex: {regex: "^https?://localhost(:[0-9]+)?$"}}}}
                          - {header: {name: origin, string_match: {exact: "http://localhost:3000", ignore_case: true}}}
                envoy.filters.http.cors:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  allow_origin_string_match:
                  - {exact: "http://localhost:3000", ignore_case: true}
                  forward_not_matching_preflights: false
              routes:
              - {name: "shop-rpc", match: {path: "/example.shop.v1.CartService/AddItem"}, metadata: {filter_metadata: {"proxyfile.rate_limit": {all: "rpc"}}}, typed_per_filter_config: {envoy.filters.http.connect_grpc_bridge: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}, envoy.filters.http.lua: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}}, route: {cluster: "shop_grpc"}}
              - {name: "shop-rpc", match: {path: "/example.shop.v1.CartService/GetCart"}, metadata: {filter_metadata: {"proxyfile.rate_limit": {all: "rpc"}}}, typed_per_filter_config: {envoy.filters.http.connect_grpc_bridge: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}, envoy.filters.http.lua: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}}, route: {cluster: "shop_grpc"}}
              - name: "login"
                match: {path: "/login", headers: [{name: ":method", string_match: {exact: "POST"}}]}
                metadata: {filter_metadata: {"proxyfile.rate_limit": {client: "login"}}}
                route: {cluster: "shop_http"}
              - name: "shop"
                match: {prefix: "/"}
                route: {cluster: "shop_http"}
  clusters:
  - name: "shop_http"
    type: STATIC
    load_assignment:
      cluster_name: "shop_http"
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: "127.0.0.1", port_value: 8080}}}}]}]
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http_protocol_options: {}}
  - name: "shop_grpc"
    type: STATIC
    load_assignment:
      cluster_name: "shop_grpc"
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: "127.0.0.1", port_value: 8081}}}}]}]
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
