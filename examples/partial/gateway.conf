# The other side of each optional key, in HOCON: no admin listener, the default namespace, a check that is off and
# denies when it cannot be asked, one limit, one timeout, addresses that are not the default.
include required("rpc-methods.conf")
listen = 8000
limits { heap = 64MiB }
timeouts { request = 30s }
services {
  web { http = 3000, address = "10.0.0.5" }
  identity { http = 4000, address = "::1" }
  backend { grpc = 5000 }
}
auth {
  ask = "identity /check"
  timeout = 250ms
  enabled = false
  when_unavailable = deny
  send = [authorization]
  accept = [x-identity]
}
origins {
  only { hosts = [gateway.example.net], origins = ["https://app.example.net"] }
}
routes = [
  { rpc { to { "*" = backend } } }
  { name = login, path = /login, method = POST, to = identity, rewrite = /session, auth = off }
  { name = web, prefix = /, to = web }
]
log { status_from = 500, sample = 0% }
