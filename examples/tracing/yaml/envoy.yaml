# Generated by proxyfile. Do not edit: change the proxyfile beside it and run proxyfile render; proxyfile check fails on a hand edit.
static_resources:
  listeners:
  - name: public
    address: {socket_address: {address: 0.0.0.0, port_value: 8000}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: public
          use_remote_address: false
          always_set_request_id_in_response: true
          request_id_extension:
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
              pack_trace_reason: false
          tracing:
            max_path_tag_length: 0
            custom_tags:
            - tag: "environment"
              environment: {name: "APP_ENVIRONMENT", default_value: "local"}
            - tag: "request_id"
              request_header: {name: "x-request-id"}
            provider:
              name: envoy.tracers.xray
              typed_config:
                "@type": type.googleapis.com/envoy.config.trace.v3.XRayConfig
                daemon_endpoint: {protocol: UDP, address: "127.0.0.1", port_value: 2000}
                segment_name: "example-gateway"
                sampling_rule_manifest:
                  inline_string: |
                    {"version": 2,
                     "default": {"fixed_target": 1, "rate": 0.05},
                     "rules": [{"host": "*", "http_method": "*", "url_path": "/live*", "fixed_target": 0, "rate": 0}]}
          server_header_transformation: PASS_THROUGH
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: UNESCAPE_AND_FORWARD
          upgrade_configs: [{upgrade_type: websocket}]
          local_reply_config:
            mappers:
            - filter: {response_flag_filter: {flags: [UF, UH, UC, URX]}}
              status_code: 502
              body: {inline_string: ""}
            - filter:
                and_filter:
                  filters:
                  - status_code_filter:
                      comparison: {op: EQ, value: {default_value: 403, runtime_key: gateway.local_reply.origin_refused_status}}
                  - header_filter:
                      header: {name: origin, present_match: true}
              body: {inline_string: "Invalid CORS request"}
            - filter:
                and_filter:
                  filters:
                  - response_flag_filter: {flags: [UAEX]}
                  - status_code_filter: {comparison: {op: GE, value: {default_value: 200}}}
                  - status_code_filter: {comparison: {op: LE, value: {default_value: 299}}}
              status_code: 403
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  time: "%START_TIME%"
                  route: "%ROUTE_NAME%"
                  host: "%REQ(:AUTHORITY)%"
                  method: "%REQ(:METHOD)%"
                  protocol: "%PROTOCOL%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  details: "%RESPONSE_CODE_DETAILS%"
                  duration_ms: "%DURATION%"
                  upstream_ms: "%RESPONSE_DURATION%"
                  bytes_in: "%BYTES_RECEIVED%"
                  bytes_out: "%BYTES_SENT%"
                  upstream: "%UPSTREAM_CLUSTER%"
                  request_id: "%REQ(X-REQUEST-ID)%"
                  authz_us: "%FILTER_STATE(envoy.filters.http.ext_authz:FIELD:latency_us)%"
          - name: envoy.access_loggers.stdout
            filter:
              response_flag_filter: {flags: [UH, UF, UO, UC, UT, URX, UPE]}
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  event: gateway_upstream_failure
                  route: "%ROUTE_NAME%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  upstream: "%UPSTREAM_CLUSTER%"
          - name: envoy.access_loggers.stdout
            filter:
              and_filter:
                filters:
                - header_filter:
                    header: {name: x-envoy-auth-failure-mode-allowed, present_match: true}
                - metadata_filter:
                    matcher: {filter: "proxyfile", path: [{key: filtered}], value: {bool_match: true}}
                    match_if_key_not_found: false
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  event: gateway_auth_unavailable
                  route: "%ROUTE_NAME%"
                  action: "%METADATA(ROUTE:proxyfile:action)%"
                  status: "%RESPONSE_CODE%"
                  failure_mode_allowed: "%REQ(x-envoy-auth-failure-mode-allowed)%"
                  request_id: "%REQ(X-REQUEST-ID)%"
          early_header_mutation_extensions:
          - name: envoy.http.early_header_mutation.header_mutation
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
              mutations:
              - remove_on_match: {key_matcher: {prefix: "x-debug-"}}
              - remove: "x-gateway-action"
              - remove: "x-gateway-reports"
              - remove: "x-user-id"
              - remove: x-envoy-auth-failure-mode-allowed
              - remove: x-envoy-downstream-service-cluster
              - remove: x-envoy-downstream-service-node
          http_filters:
          - name: envoy.filters.http.set_metadata
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_metadata.v3.Config
              metadata:
              - metadata_namespace: "proxyfile"
                value: {filtered: true}
          - name: envoy.filters.http.header_mutation
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                response_mutations:
                - append:
                    header: {key: vary, value: Origin}
                    append_action: APPEND_IF_EXISTS_OR_ADD
                - remove: x-envoy-upstream-service-time
          - name: envoy.filters.http.rbac
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              http_service:
                server_uri: {uri: "http://127.0.0.1:4000/check", cluster: "identity_http", timeout: 1s}
                path_override: "/check"
                authorization_request:
                  headers_to_add: [{key: x-gateway-timeout-ms, value: "1000"}]
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                    - exact: "x-user-id"
              failure_mode_allow: false
              allowed_headers:
                patterns:
                - exact: x-gateway-action
                - exact: x-gateway-reports
              emit_filter_state_stats: true
              filter_enabled:
                default_value: {numerator: 100, denominator: HUNDRED}
                runtime_key: gateway.ext_authz.enabled
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: true
          route_config:
            name: public
            request_headers_to_remove: [x-gateway-action, x-gateway-reports]
            ignore_port_in_host_matching: true
            virtual_hosts:
            - name: "all"
              domains: ["localhost"]
              typed_per_filter_config:
                envoy.filters.http.rbac:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        browser-origins:
                          permissions: [{any: true}]
                          principals:
                          - {not_id: {header: {name: origin, present_match: true}}}
                          - {header: {name: origin, string_match: {safe_regex: {regex: "^https?://localhost(:[0-9]+)?$"}}}}
                          - {header: {name: origin, string_match: {exact: "http://localhost:3000", ignore_case: true}}}
                envoy.filters.http.cors:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  allow_origin_string_match:
                  - {exact: "http://localhost:3000", ignore_case: true}
                  forward_not_matching_preflights: false
              routes:
              - name: "refused:dot-segment-with-parameter"
                match: {safe_regex: {regex: ".*/\\.\\.?;.*"}}
                direct_response: {status: 400}
              - name: "app"
                match: {prefix: "/"}
                metadata: {filter_metadata: {"proxyfile": {action: ""}}}
                route: {cluster: "app_http"}
  clusters:
  - name: "app_http"
    type: STATIC
    load_assignment:
      cluster_name: "app_http"
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: "127.0.0.1", port_value: 3000}}}}]}]
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http_protocol_options: {}}
  - name: "identity_http"
    type: STATIC
    load_assignment:
      cluster_name: "identity_http"
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: "127.0.0.1", port_value: 4000}}}}]}]
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http_protocol_options: {}}
