  map "$upstream_status:$upstream_connect_time:$upstream_header_time:$pf_log_cut:$upstream_bytes_received" $pf_log_failure { "~:UPE:" UPE; "~^502:-:" UF; "~^502:[0-9][^:]*:-::0\\z" UC; "~^502:[0-9][^:]*:-:" UPE; "~^504:-:" UF; "~^504:[0-9][^:]*:-:" UT; default ""; }
