  upstream app_http {
    server 127.0.0.1:3000 max_fails=0;
    keepalive 32;
    keepalive_timeout 1h;
  }

  server {
    listen 8443 ssl default_server;
    http2 on;
    if ($pf_f_request) {
      return 400 "$pf_empty";
    }
    if ($pf_f_426) {
      return 426 "Upgrade Required";
    }
    error_page 495 496 497 = @pf_tls_refused;
    error_page 421 = @pf_tls_misdirected;
    location @pf_tls_refused {
      return 400 "$pf_empty";
    }
    location @pf_tls_misdirected {
      return 421 "$pf_empty";
    }
    location / {
      return 404 "$pf_empty";
    }
  }

  # The environment all.
  server {
    listen 8443 ssl;
    http2 on;
    server_name "api.example.com";
    recursive_error_pages on;
    add_header x-request-id $pf_request_id always;
    add_header Vary Origin always;
    set $pf_reached 1;
    add_header Access-Control-Allow-Origin $pf_acao1 always;
    proxy_hide_header Access-Control-Allow-Origin;
    if ($pf_f_request) {
      return 400 "$pf_empty";
    }
    if ($pf_f_426) {
      return 426 "Upgrade Required";
    }
    if ($pf_f_host_dot) {
      return 404 "$pf_empty";
    }
    if ($pf_o1) {
      return 403 "Invalid CORS request";
    }
    error_page 495 496 497 = @pf_tls_refused;
    error_page 421 = @pf_tls_misdirected;
    location @pf_tls_refused {
      add_header x-request-id $pf_request_id always;
      add_header Vary Origin always;
      return 400 "$pf_empty";
    }
    location @pf_tls_misdirected {
      add_header x-request-id $pf_request_id always;
      add_header Vary Origin always;
      return 421 "$pf_empty";
    }
    location / {
      return 418;
      error_page 418 = @pf_r_$pf_route;
    }
    location @pf_r_refused {
      add_header x-request-id $pf_request_id always;
      add_header Vary Origin always;
      return 400 "$pf_empty";
    }
    location @pf_r_upgrade-refused {
      add_header x-request-id $pf_request_id always;
      add_header Vary Origin always;
      return 403 "$pf_upgrade_refused";
    }
    location @pf_r_preflight {
      add_header x-request-id $pf_request_id always;
      add_header Vary Origin always;
      add_header Access-Control-Allow-Origin $pf_acao1 always;
      return 200 "$pf_empty";
    }
    location @pf_r_no-route {
      add_header x-request-id $pf_request_id always;
      add_header Vary Origin always;
      return 404 "$pf_empty";
