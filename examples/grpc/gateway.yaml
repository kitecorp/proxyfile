# yaml-language-server: $schema=../../schema/proxyfile.schema.json
# A gateway for gRPC clients alone: envoy.connect_bridge is false, so each RPC route sends a call to the service as it
# came, with no Connect bridge and no Lua filter.
listen: 8000
services:
  orders: {grpc: 9000}
origins:
  all: {hosts: [localhost]}
routes:
  - rpc: {to: {"*": orders}}
rpc:
  methods:
    - {service: example.orders.v1.OrderService, method: GetOrder}
    - {service: example.orders.v1.OrderService, method: ListOrders}
envoy:
  connect_bridge: false
