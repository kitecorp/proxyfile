# The grpc example in HOCON. It gives the same envoy.yaml as gateway.yaml beside it.
listen = 8000
services {
  orders { grpc = 9000 }
}
origins {
  all { hosts = [localhost] }
}
routes = [
  { rpc { to { "*" = orders } } }
]
rpc {
  methods = [
    { service = "example.orders.v1.OrderService", method = GetOrder }
    { service = "example.orders.v1.OrderService", method = ListOrders }
  ]
}
envoy { connect_bridge = false }
