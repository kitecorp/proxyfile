# Generated by proxyfile. Do not edit: change the proxyfile beside it and run proxyfile render; proxyfile check fails on a hand edit.
admin:
  address: {socket_address: {address: 127.0.0.1, port_value: 9901}}
  allow_paths: [{exact: /ready}, {exact: /stats}, {exact: /server_info}]
overload_manager:
  refresh_interval: 0.25s
  resource_monitors:
  - name: envoy.resource_monitors.fixed_heap
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.fixed_heap.v3.FixedHeapConfig
      max_heap_size_bytes: 268435456
  - name: envoy.resource_monitors.global_downstream_max_connections
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
      max_active_downstream_connections: 4096
  actions:
  - name: envoy.overload_actions.shrink_heap
    triggers: [{name: envoy.resource_monitors.fixed_heap, threshold: {value: 0.90}}]
  - name: envoy.overload_actions.stop_accepting_requests
    triggers: [{name: envoy.resource_monitors.fixed_heap, threshold: {value: 0.98}}]
static_resources:
  listeners:
  - name: public
    address: {socket_address: {address: 0.0.0.0, port_value: 10000}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: public
          use_remote_address: true
          always_set_request_id_in_response: true
          request_id_extension:
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
              pack_trace_reason: false
          tracing:
            client_sampling: {value: 0}
            random_sampling: {value: 10}
            custom_tags:
            - tag: "environment"
              environment: {name: "APP_ENVIRONMENT", default_value: "local"}
            - tag: "request_id"
              request_header: {name: "x-request-id"}
            provider:
              name: envoy.tracers.opentelemetry
              typed_config:
                "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                grpc_service:
                  envoy_grpc: {cluster_name: "otel_collector"}
                service_name: "example-gateway"
          server_header_transformation: PASS_THROUGH
          max_request_headers_kb: 96
          common_http_protocol_options: {max_headers_count: 150}
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: UNESCAPE_AND_FORWARD
          upgrade_configs: [{upgrade_type: websocket}]
          local_reply_config:
            mappers:
            - filter: {response_flag_filter: {flags: [UF, UH, UC, URX]}}
              status_code: 502
              body: {inline_string: ""}
            - filter:
                and_filter:
                  filters:
                  - status_code_filter:
                      comparison: {op: EQ, value: {default_value: 403, runtime_key: gateway.local_reply.origin_refused_status}}
                  - header_filter:
                      header: {name: origin, present_match: true}
              body: {inline_string: "Invalid CORS request"}
            - filter:
                and_filter:
                  filters:
                  - response_flag_filter: {flags: [UAEX]}
                  - status_code_filter: {comparison: {op: GE, value: {default_value: 200}}}
                  - status_code_filter: {comparison: {op: LE, value: {default_value: 299}}}
              status_code: 403
            - filter: {response_flag_filter: {flags: [UAEX]}}
            - filter:
                and_filter:
                  filters:
                  - status_code_filter:
                      comparison: {op: EQ, value: {default_value: 429, runtime_key: gateway.local_reply.rate_limited_status}}
                  - header_filter:
                      header: {name: connect-protocol-version, present_match: true}
              body: {inline_string: '{"code":"resource_exhausted","message":"local_rate_limited"}'}
              body_format_override:
                text_format_source: {inline_string: "%LOCAL_REPLY_BODY%"}
                content_type: application/json
          access_log:
          - name: envoy.access_loggers.stdout
            filter:
              or_filter:
                filters:
                - status_code_filter:
                    comparison: {op: GE, value: {default_value: 400, runtime_key: gateway.request_log.min_status}}
                - response_flag_filter: {}
                - runtime_filter:
                    runtime_key: gateway.request_log.sample
                    percent_sampled: {numerator: 1, denominator: HUNDRED}
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  time: "%START_TIME%"
                  route: "%ROUTE_NAME%"
                  host: "%REQ(:AUTHORITY)%"
                  method: "%REQ(:METHOD)%"
                  protocol: "%PROTOCOL%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  details: "%RESPONSE_CODE_DETAILS%"
                  duration_ms: "%DURATION%"
                  upstream_ms: "%RESPONSE_DURATION%"
                  bytes_in: "%BYTES_RECEIVED%"
                  bytes_out: "%BYTES_SENT%"
                  upstream: "%UPSTREAM_CLUSTER%"
                  request_id: "%REQ(X-REQUEST-ID)%"
                  authz_us: "%FILTER_STATE(envoy.filters.http.ext_authz:FIELD:latency_us)%"
          - name: envoy.access_loggers.stdout
            filter:
