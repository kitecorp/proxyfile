                - metadata: {descriptor_key: bucket, metadata_key: {key: "example.gateway.rate_limit", path: [{key: all}]}, source: ROUTE_ENTRY}
              - actions:
                - metadata: {descriptor_key: bucket, metadata_key: {key: "example.gateway.rate_limit", path: [{key: client}]}, source: ROUTE_ENTRY}
                - remote_address: {}
              descriptors:
              - entries: [{key: bucket, value: "rpc"}]
                token_bucket: {max_tokens: 100, tokens_per_fill: 100, fill_interval: 1s}
              - entries: [{key: bucket, value: "catalog"}, {key: remote_address}]
                token_bucket: {max_tokens: 30, tokens_per_fill: 20, fill_interval: 1s}
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
