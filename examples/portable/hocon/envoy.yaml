# Generated by proxyfile. Do not edit: change the proxyfile beside it and run proxyfile render; proxyfile check fails on a hand edit.
admin:
  address: {socket_address: {address: 127.0.0.1, port_value: 9901}}
  allow_paths: [{exact: /ready}, {exact: /stats}, {exact: /server_info}]
overload_manager:
  refresh_interval: 0.25s
  resource_monitors:
  - name: envoy.resource_monitors.global_downstream_max_connections
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
      max_active_downstream_connections: 4096
static_resources:
  listeners:
  - name: public
    address: {socket_address: {address: 0.0.0.0, port_value: 10000}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: public
          use_remote_address: true
          always_set_request_id_in_response: true
          server_header_transformation: PASS_THROUGH
          max_request_headers_kb: 96
          common_http_protocol_options: {max_headers_count: 150}
          normalize_path: true
          merge_slashes: true
          path_with_escaped_slashes_action: UNESCAPE_AND_FORWARD
          upgrade_configs: [{upgrade_type: websocket}]
          local_reply_config:
            mappers:
            - filter: {response_flag_filter: {flags: [UF, UH, UC, URX]}}
              status_code: 502
              body: {inline_string: ""}
            - filter:
                and_filter:
                  filters:
                  - status_code_filter:
                      comparison: {op: EQ, value: {default_value: 403, runtime_key: gateway.local_reply.origin_refused_status}}
                  - header_filter:
                      header: {name: origin, present_match: true}
              body: {inline_string: "Invalid CORS request"}
            - filter:
                and_filter:
                  filters:
                  - response_flag_filter: {flags: [UAEX]}
                  - status_code_filter: {comparison: {op: GE, value: {default_value: 200}}}
                  - status_code_filter: {comparison: {op: LE, value: {default_value: 299}}}
              status_code: 403
            - filter: {response_flag_filter: {flags: [UAEX]}}
            - filter:
                and_filter:
                  filters:
                  - status_code_filter:
                      comparison: {op: EQ, value: {default_value: 429, runtime_key: gateway.local_reply.rate_limited_status}}
                  - header_filter:
                      header: {name: connect-protocol-version, present_match: true}
              body: {inline_string: '{"code":"resource_exhausted","message":"local_rate_limited"}'}
              body_format_override:
                text_format_source: {inline_string: "%LOCAL_REPLY_BODY%"}
                content_type: application/json
          access_log:
          - name: envoy.access_loggers.stdout
            filter:
              or_filter:
                filters:
                - status_code_filter:
                    comparison: {op: GE, value: {default_value: 400, runtime_key: gateway.request_log.min_status}}
                - response_flag_filter: {}
                - runtime_filter:
                    runtime_key: gateway.request_log.sample
                    percent_sampled: {numerator: 1, denominator: HUNDRED}
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  time: "%START_TIME%"
                  route: "%ROUTE_NAME%"
                  host: "%REQ(:AUTHORITY)%"
                  method: "%REQ(:METHOD)%"
                  protocol: "%PROTOCOL%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  details: "%RESPONSE_CODE_DETAILS%"
                  duration_ms: "%DURATION%"
                  upstream_ms: "%RESPONSE_DURATION%"
                  bytes_in: "%BYTES_RECEIVED%"
                  bytes_out: "%BYTES_SENT%"
                  upstream: "%UPSTREAM_CLUSTER%"
                  request_id: "%REQ(X-REQUEST-ID)%"
                  authz_us: "%FILTER_STATE(envoy.filters.http.ext_authz:FIELD:latency_us)%"
          - name: envoy.access_loggers.stdout
            filter:
              response_flag_filter: {flags: [UH, UF, UO, UC, UT, URX, UPE]}
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  event: gateway_upstream_failure
                  route: "%ROUTE_NAME%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  upstream: "%UPSTREAM_CLUSTER%"
          - name: envoy.access_loggers.stdout
            filter:
              and_filter:
                filters:
                - header_filter:
                    header: {name: x-envoy-auth-failure-mode-allowed, present_match: true}
                - metadata_filter:
                    matcher: {filter: "proxyfile", path: [{key: filtered}], value: {bool_match: true}}
                    match_if_key_not_found: false
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  event: gateway_auth_unavailable
                  route: "%ROUTE_NAME%"
                  action: "%METADATA(ROUTE:proxyfile:action)%"
                  status: "%RESPONSE_CODE%"
                  failure_mode_allowed: "%REQ(x-envoy-auth-failure-mode-allowed)%"
                  request_id: "%REQ(X-REQUEST-ID)%"
          early_header_mutation_extensions:
          - name: envoy.http.early_header_mutation.header_mutation
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
              mutations:
              - remove: "x-client-id"
              - remove: "x-gateway-action"
              - remove: "x-gateway-reports"
              - remove: "x-user-id"
              - remove: "x-tier-level"
              - remove: "x-user-check"
              - remove: x-envoy-auth-failure-mode-allowed
          http_filters:
          - name: envoy.filters.http.set_metadata
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_metadata.v3.Config
              metadata:
              - metadata_namespace: "proxyfile"
                value: {filtered: true}
          - name: envoy.filters.http.header_mutation
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                response_mutations:
                - append:
                    header: {key: vary, value: Origin}
                    append_action: APPEND_IF_EXISTS_OR_ADD
                - remove: x-envoy-upstream-service-time
          - name: envoy.filters.http.rbac
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: rate_limit
              filter_enabled:
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              rate_limited_as_resource_exhausted: true
              always_consume_default_token_bucket: false
              max_dynamic_descriptors: 65536
              rate_limits:
              - actions:
                - metadata: {descriptor_key: bucket, metadata_key: {key: "proxyfile.rate_limit", path: [{key: all}]}, source: ROUTE_ENTRY}
              - actions:
                - metadata: {descriptor_key: bucket, metadata_key: {key: "proxyfile.rate_limit", path: [{key: client}]}, source: ROUTE_ENTRY}
                - remote_address: {}
              descriptors:
              - entries: [{key: bucket, value: "rpc"}]
                token_bucket: {max_tokens: 100, tokens_per_fill: 100, fill_interval: 1s}
              - entries: [{key: bucket, value: "catalog"}, {key: remote_address}]
                token_bucket: {max_tokens: 20, tokens_per_fill: 20, fill_interval: 1s}
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.common.matching.v3.ExtensionWithMatcher
              extension_config:
                name: envoy.filters.http.ext_authz
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                  http_service:
                    server_uri: {uri: "http://127.0.0.1:7070/auth/check", cluster: "accounts_http", timeout: 1.5s}
                    path_override: "/auth/check"
                    authorization_request:
                      headers_to_add: [{key: x-gateway-timeout-ms, value: "1500"}, {key: x-forwarded-uri, value: "%REQ(:PATH)%"}, {key: x-forwarded-method, value: "%REQ(:METHOD)%"}, {key: x-forwarded-proto, value: "%REQ(:SCHEME)%"}, {key: x-forwarded-host, value: "%REQ(:AUTHORITY)%"}]
                    authorization_response:
                      allowed_upstream_headers:
                        patterns:
                        - exact: "x-user-id"
                        - exact: "x-tier-level"
                        - exact: "x-user-check"
                  failure_mode_allow: true
                  failure_mode_allow_header_add: true
                  allowed_headers:
                    patterns:
                    - exact: "authorization"
                    - exact: "x-country"
                    - exact: x-gateway-action
                    - exact: x-gateway-reports
                  emit_filter_state_stats: true
                  filter_enabled:
                    default_value: {numerator: 100, denominator: HUNDRED}
                    runtime_key: gateway.ext_authz.enabled
              xds_matcher:
                matcher_list:
                  matchers:
                  - predicate:
                      not_matcher:
                        single_predicate:
                          input:
                            name: "authorization"
                            typed_config:
                              "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                              header_name: "authorization"
                          value_match: {safe_regex: {google_re2: {}, regex: ".+"}}
                    on_match:
                      action:
                        name: skip
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.common.matcher.action.v3.SkipFilter
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: true
          route_config:
            name: public
            request_headers_to_remove: [x-gateway-action, x-gateway-reports]
            ignore_port_in_host_matching: true
            virtual_hosts:
            - name: "live"
              domains: ["api.example.com", "api.example.org"]
              typed_per_filter_config:
                envoy.filters.http.rbac:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        browser-origins:
                          permissions: [{any: true}]
                          principals:
                          - {not_id: {header: {name: origin, present_match: true}}}
                          - {header: {name: origin, string_match: {safe_regex: {regex: "^https?://api\\.example\\.com(:[0-9]+)?$"}}}}
                          - {header: {name: origin, string_match: {safe_regex: {regex: "^https?://api\\.example\\.org(:[0-9]+)?$"}}}}
                          - {header: {name: origin, string_match: {exact: "https://example.com", ignore_case: true}}}
                          - {header: {name: origin, string_match: {exact: "https://www.example.com", ignore_case: true}}}
                          - {header: {name: origin, string_match: {safe_regex: {regex: "^https://.*\\.example\\.com$"}}}}
                envoy.filters.http.cors:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  allow_origin_string_match:
                  - {exact: "https://example.com", ignore_case: true}
                  - {exact: "https://www.example.com", ignore_case: true}
                  - {safe_regex: {regex: "^https://.*\\.example\\.com$"}}
                  allow_methods: "*"
                  allow_headers: "*"
                  expose_headers: "Content-Disposition,X-Request-Id"
                  max_age: "600"
                  forward_not_matching_preflights: false
              routes:
              - name: "refused:dot-segment-with-parameter"
                match: {safe_regex: {regex: ".*/\\.\\.?(?:;|%3[Bb]).*"}}
                direct_response: {status: 400}
              - name: "accounts-events"
                match: {safe_regex: {regex: "^/events/[a-z0-9-]+$"}}
                route: {cluster: "accounts_http", host_rewrite_literal: "127.0.0.1:7070", timeout: 0s, idle_timeout: 90s}
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - {name: "accounts-rpc", match: {path: "/example.accounts.v1.ProfileService/GetProfile"}, metadata: {filter_metadata: {"proxyfile": {action: ""}, "proxyfile.rate_limit": {all: "rpc"}}}, route: {cluster: "accounts_grpc", host_rewrite_literal: "127.0.0.1:7070", timeout: 0s, idle_timeout: 90s}}
              - {name: "shop", match: {path: "/example.shop.v1.CartService/AddItem"}, metadata: {filter_metadata: {"proxyfile": {action: "buy"}, "proxyfile.rate_limit": {all: "rpc"}}}, typed_per_filter_config: {envoy.filters.http.header_mutation: {"@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute, mutations: {request_mutations: [{append: {header: {key: x-gateway-action, value: "buy"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}}, {append: {header: {key: x-gateway-reports, value: "browse"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}}]}}}, route: {cluster: "shop_grpc", timeout: 0s, idle_timeout: 90s}}
              - {name: "shop", match: {path: "/example.shop.v1.CartService/GetCart"}, metadata: {filter_metadata: {"proxyfile": {action: "browse"}, "proxyfile.rate_limit": {all: "rpc"}}}, typed_per_filter_config: {envoy.filters.http.header_mutation: {"@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute, mutations: {request_mutations: [{append: {header: {key: x-gateway-action, value: "browse"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}}]}}}, route: {cluster: "shop_grpc", timeout: 0s, idle_timeout: 90s}}
              - name: "accounts-webhooks"
                match: {path: "/api/webhooks", headers: [{name: ":method", string_match: {exact: "POST"}}]}
                route: {cluster: "accounts_http", host_rewrite_literal: "127.0.0.1:7070", prefix_rewrite: "/hooks/payments", timeout: 0s, idle_timeout: 90s}
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - name: "public"
                match: {prefix: "/public/"}
                route: {cluster: "shop_http", timeout: 0s, idle_timeout: 90s}
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - name: "catalog"
                match: {prefix: "/catalog/"}
                metadata: {filter_metadata: {"proxyfile": {action: ""}, "proxyfile.rate_limit": {client: "catalog"}}}
                route: {cluster: "catalog_http", timeout: 0s, idle_timeout: 90s}
              - name: "shop"
                match: {prefix: "/"}
                metadata: {filter_metadata: {"proxyfile": {action: ""}}}
                route: {cluster: "shop_http", timeout: 0s, idle_timeout: 90s}
            - name: "test"
              domains: ["api.test.example.com"]
              typed_per_filter_config:
                envoy.filters.http.rbac:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
