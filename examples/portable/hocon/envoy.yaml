                match: {path: "/api/webhooks", headers: [{name: ":method", string_match: {exact: "POST"}}]}
                route: {cluster: "accounts_http", host_rewrite_literal: "127.0.0.1:7070", prefix_rewrite: "/hooks/payments", timeout: 0s, idle_timeout: 90s}
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - name: "public"
                match: {prefix: "/public/"}
                route: {cluster: "shop_http", timeout: 0s, idle_timeout: 90s}
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - name: "catalog"
                match: {prefix: "/catalog/"}
                metadata: {filter_metadata: {"proxyfile": {action: ""}, "proxyfile.rate_limit": {client: "catalog"}}}
                route: {cluster: "catalog_http", timeout: 0s, idle_timeout: 90s}
              - name: "shop"
                match: {prefix: "/"}
                metadata: {filter_metadata: {"proxyfile": {action: ""}}}
                route: {cluster: "shop_http", timeout: 0s, idle_timeout: 90s}
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            alpn_protocols: [h2, http/1.1]
            tls_certificates: [{certificate_chain: {filename: "/etc/gateway/tls/certificate.pem"}, private_key: {filename: "/etc/gateway/tls/key.pem"}}]
            validation_context: {trusted_ca: {filename: "/etc/gateway/tls/clients-ca.pem"}}
          require_client_certificate: true
  clusters:
  - name: "shop_http"
    type: STATIC
    lb_policy: LEAST_REQUEST
    load_assignment:
      cluster_name: "shop_http"
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: "10.0.1.11", port_value: 8080}}}}, {endpoint: {address: {socket_address: {address: "10.0.1.12", port_value: 8080}}}}]}]
    circuit_breakers: {thresholds: [{max_connections: 4096, max_pending_requests: 4096, max_requests: 4096}]}
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        common_http_protocol_options: {idle_timeout: 45s}
        explicit_http_config: {http_protocol_options: {}}
  - name: "shop_grpc"
    type: STATIC
    lb_policy: LEAST_REQUEST
    load_assignment:
      cluster_name: "shop_grpc"
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: "10.0.1.11", port_value: 8081}}}}, {endpoint: {address: {socket_address: {address: "10.0.1.12", port_value: 8081}}}}]}]
    circuit_breakers: {thresholds: [{max_connections: 4096, max_pending_requests: 4096, max_requests: 4096}]}
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        common_http_protocol_options: {idle_timeout: 45s}
        explicit_http_config: {http2_protocol_options: {}}
  - name: "accounts_grpc"
    type: STATIC
    load_assignment:
      cluster_name: "accounts_grpc"
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: "127.0.0.1", port_value: 7070}}}}]}]
    circuit_breakers: {thresholds: [{max_connections: 4096, max_pending_requests: 4096, max_requests: 4096}]}
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        common_http_protocol_options: {idle_timeout: 45s}
        explicit_http_config: {http2_protocol_options: {}}
  - name: "accounts_http"
    type: STATIC
    load_assignment:
      cluster_name: "accounts_http"
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: "127.0.0.1", port_value: 7070}}}}]}]
    circuit_breakers: {thresholds: [{max_connections: 4096, max_pending_requests: 4096, max_requests: 4096}]}
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        common_http_protocol_options: {idle_timeout: 45s}
        explicit_http_config: {http_protocol_options: {}}
  - name: "catalog_http"
    cluster_type:
      name: envoy.cluster.dns
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dns.v3.DnsCluster
        dns_lookup_family: ALL
        typed_dns_resolver_config:
          name: envoy.network.dns_resolver.cares
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig
            resolvers: [{socket_address: {address: "10.0.0.2", port_value: 53}}]
    lb_policy: RING_HASH
    load_assignment:
      cluster_name: "catalog_http"
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: "catalog.internal.example", port_value: 8090}}}}]}]
    circuit_breakers: {thresholds: [{max_connections: 4096, max_pending_requests: 4096, max_requests: 4096}]}
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        hash_policy: [{header: {header_name: "x-session-id"}}]
        common_http_protocol_options: {idle_timeout: 45s}
        explicit_http_config: {http_protocol_options: {}}
