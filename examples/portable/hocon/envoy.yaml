                route: {cluster: "accounts_http", host_rewrite_literal: "127.0.0.1:7070", prefix_rewrite: "/hooks/payments", timeout: 0s, idle_timeout: 90s}
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - name: "public"
                match: {prefix: "/public/"}
                route: {cluster: "shop_http", timeout: 0s, idle_timeout: 90s}
                typed_per_filter_config:
