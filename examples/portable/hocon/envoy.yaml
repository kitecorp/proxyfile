              - name: "shop"
                match: {prefix: "/"}
                metadata: {filter_metadata: {"proxyfile": {action: ""}}}
                route: {cluster: "shop_http", timeout: 0s, idle_timeout: 90s}
            - name: "local"
              domains: ["127.0.0.1", "localhost"]
              typed_per_filter_config:
                envoy.filters.http.rbac:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        browser-origins:
                          permissions: [{any: true}]
                          principals:
                          - {not_id: {header: {name: origin, present_match: true}}}
                          - {header: {name: origin, string_match: {safe_regex: {regex: "^https?://127\\.0\\.0\\.1(:[0-9]+)?$"}}}}
                          - {header: {name: origin, string_match: {safe_regex: {regex: "^https?://localhost(:[0-9]+)?$"}}}}
                          - {header: {name: origin, string_match: {safe_regex: {regex: "^http://.*\\.example\\.com:.*$"}}}}
