                          - {header: {name: origin, string_match: {exact: "http://localhost:3000", ignore_case: true}}}
                          - {header: {name: origin, string_match: {exact: "https://test.example.com", ignore_case: true}}}
                          - {header: {name: origin, string_match: {safe_regex: {regex: "^https://.*\\.test\\.example\\.com$"}}}}
                envoy.filters.http.cors:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  allow_origin_string_match:
                  - {exact: "http://localhost:3000", ignore_case: true}
                  - {exact: "https://test.example.com", ignore_case: true}
                  - {safe_regex: {regex: "^https://.*\\.test\\.example\\.com$"}}
                  allow_methods: "*"
                  allow_headers: "*"
                  expose_headers: "Content-Disposition,X-Request-Id"
                  max_age: "600"
                  forward_not_matching_preflights: false
              routes:
              - name: "refused:dot-segment-with-parameter"
