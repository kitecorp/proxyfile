                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - {name: "accounts-rpc", match: {path: "/example.accounts.v1.ProfileService/GetProfile"}, metadata: {filter_metadata: {"proxyfile": {action: ""}, "proxyfile.rate_limit": {all: "rpc"}}}, route: {cluster: "accounts_grpc", host_rewrite_literal: "127.0.0.1:7070", timeout: 0s, idle_timeout: 90s}}
              - {name: "shop", match: {path: "/example.shop.v1.CartService/AddItem"}, metadata: {filter_metadata: {"proxyfile": {action: "buy"}, "proxyfile.rate_limit": {all: "rpc"}}}, typed_per_filter_config: {envoy.filters.http.header_mutation: {"@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute, mutations: {request_mutations: [{append: {header: {key: x-gateway-action, value: "buy"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}}, {append: {header: {key: x-gateway-reports, value: "browse"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}}]}}}, route: {cluster: "shop_grpc", timeout: 0s, idle_timeout: 90s}}
              - {name: "shop", match: {path: "/example.shop.v1.CartService/GetCart"}, metadata: {filter_metadata: {"proxyfile": {action: "browse"}, "proxyfile.rate_limit": {all: "rpc"}}}, typed_per_filter_config: {envoy.filters.http.header_mutation: {"@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute, mutations: {request_mutations: [{append: {header: {key: x-gateway-action, value: "browse"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}}]}}}, route: {cluster: "shop_grpc", timeout: 0s, idle_timeout: 90s}}
              - name: "accounts-webhooks"
