# The check the master ruleset requires. Its job name is the check's name, so the job must stay a top-level job
# called Required.
name: Pre-merge
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  required:
    name: Required
    runs-on: ubuntu-24.04
    steps:
      # The token stays out of the git config, so no test or script the job runs can read it from there.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -count=1 ./...
      # The site the Pages workflow publishes from master, built and checked the same way but not published, so a change
      # that breaks a page or a link fails here before it merges.
      - name: The documentation site builds, with every page, the credit and every link
        run: |
          scripts/build-site.sh "$RUNNER_TEMP/site"
          scripts/check-site.sh "$RUNNER_TEMP/site"
      - name: Envoy 1.40.2 loads every generated example
        run: scripts/validate-envoy.sh examples/*/*/envoy.yaml
      # No example asks an auth check or writes tracing for nginx, so the battery's files that do are rendered and
      # loaded too: only the two with the check carry the stream block and its module, the check's files and the
      # tracing file with its collector by name carry the relays' socket folder, and only the two tracing files load
      # ngx_otel_module, which the validator checks on the images tagged -otel.
      - name: nginx loads every generated example and the battery's files with the auth check and tracing, each on the images it needs
        run: |
          checked=$(mktemp -d)
          for file in nginx-auth nginx-checks nginx-tracing nginx-tracing-by-name; do
            mkdir "$checked/$file"
            go run ./cmd/proxyfile render "conformance/testdata/$file.yaml" --target nginx -o "$checked/$file/nginx.conf"
          done
          scripts/validate-nginx.sh examples/*/*/nginx.conf "$checked"/*/nginx.conf
      - name: HAProxy 3.2 and 3.4 load every generated example
        run: scripts/validate-haproxy.sh examples/*/*/haproxy.cfg
      # The same requests against each proxy running the rendered file of each proxyfile its entry names in
      # conformance/targets_test.go, in Docker, among stub backends. Its tests are behind the conformance build tag, so
      # the test step above starts no container. A whole run comes close to go test's default timeout of 10 minutes,
      # so the step gives it 30, the time docs/conformance.md gives the command; alone on the runner it takes the
      # battery's lock at once.
      - name: Conformance battery
        run: |
          go vet -tags conformance ./conformance/...
          go test -tags conformance -count=1 -timeout 30m ./conformance/...
