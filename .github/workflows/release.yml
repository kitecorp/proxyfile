# A release from a version tag: the program files, their checksums and the schema on the GitHub release, and the
# image on ghcr.io. The release is created last, so it appears only when everything else worked.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # The token, which can write to the repository here, stays out of the git config, so no test or script the job
      # runs can read it from there. The release step is given its own through GH_TOKEN.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: The program reports the tag
        run: test "$(dist/proxyfile-linux-amd64 version)" = "proxyfile $GITHUB_REF_NAME"
      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # No QEMU: the Dockerfile runs nothing, it only copies a file, so building for arm64 executes no arm64 code.
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: dist
          file: release/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kitecorp/proxyfile:${{ steps.version.outputs.number }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "proxyfile $GITHUB_REF_NAME" --generate-notes
