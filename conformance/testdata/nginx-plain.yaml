# The conformance battery's second file for nginx: nginx.yaml with no pattern route. nginx matches a path holding a
# byte Envoy escapes before it matches on the path it has decoded in such a file, and refuses that path in a file with
# a pattern route, so the battery runs both. It writes no tls and keeps client_address at forwarded, the default with
# no tls, so the battery runs nginx's lines for a client in front of the proxy. It removes x-request-id from clients,
# which nginx reads to keep a client's own request id under forwarded, so a row shows the removed name read as never
# sent. Its hold service is the battery's backend that takes no connection, so a row shows the answer to a service
# that does not take one within the 5 s a file with no timeouts gives it, and its rpc entry, which retries once, sends
# example.hold.* to its held service, at the two backends that take no connection, so a row shows the answer to a
# retried call whose every try times out connecting. Its route limited admits one request a minute
# by client, and no row but the client keys' sends to it, so each of those rows finds the bucket of the address it
# sends as the rows before it left it: under forwarded the client is the last X-Forwarded-For entry when that entry is
# an address, and otherwise the peer. Every entry runs it, Envoy's too, so its literals are Envoy's answers.
listen: 10000
admin: 9901
services:
  shop:
    http: 8080
    grpc: 8081
    addresses: ["10.0.1.11", "10.0.1.12"]
  accounts: {grpc: 7070, http: 7070, host_header: "127.0.0.1:7070"}
  catalog: {http: 8090, address: "10.0.2.21"}
  hold: {http: 8095, address: "10.0.2.30"}
  held: {grpc: 8095, addresses: ["10.0.2.30", "10.0.2.31"]}
remove_from_clients: [x-request-id]
origins:
  live: {hosts: [api.example.com, api.example.org]}
  test: {hosts: [api.test.example.com]}
  local: {hosts: [127.0.0.1, localhost]}
routes:
  - rpc:
      retries: 1
      to:
        example.shop.*: {service: shop, name: shop}
        example.hold.*: {service: held, name: held}
        "*": accounts
  - {name: accounts-webhooks, path: /api/webhooks, method: POST, to: accounts, rewrite: /hooks/payments}
  - {name: catalog, prefix: /catalog/, to: catalog}
  - {name: hooks, prefix: /hooks/, to: accounts, rewrite: /in/}
  - {name: hold, prefix: /hold/, to: hold}
  - {name: limited, prefix: /limited/, to: shop, rate_limit: {requests: 1, per: 1m, by: client}}
  - {name: shop, prefix: /, to: shop}
rpc:
  methods:
    - {service: example.shop.v1.CartService, method: GetCart}
    - {service: example.accounts.v1.ProfileService, method: GetProfile}
    - {service: example.shop.v1.CartService, method: AddItem}
    - {service: example.hold.v1.S, method: Call}
