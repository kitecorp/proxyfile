# The conformance battery's file for nginx with client_address: connection and no tls, so the clients speak plain
# HTTP: the auth check under deny at one check address, asked of a request with an x-api-key header, accepting
# x-user-check, with send_request: true, and one route to shop. It runs the scenario of the scheme the check is told
# alone, so its rows show what each proxy tells the check over plain HTTP: an absolute https target, which the Envoy
# output answers 403 and nginx serves, an HTTP/2 request with :scheme https and a client's own x-forwarded-proto.
# Envoy's entry runs it too, so each literal on it is Envoy's measured answer.
listen: 10000
admin: 9901
client_address: connection
services:
  shop:
    http: 8080
    addresses: ["10.0.1.11", "10.0.1.12"]
  checks: {http: 7070, address: "10.0.3.31"}
auth:
  ask: checks /auth/check
  timeout: 1500ms
  enabled: true
  when_unavailable: deny
  only_with_header: x-api-key
  accept: [x-user-check]
  send_request: true
origins:
  local: {hosts: [127.0.0.1, localhost]}
routes:
  - {name: shop, prefix: /, to: shop}
