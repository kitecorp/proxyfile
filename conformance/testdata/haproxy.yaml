  - {name: k01, pattern: "/k01/(a|b)*a(a|b){12}c", to: catalog}
  - {name: k02, pattern: "/k02/(a|b)*a(a|b){12}c", to: catalog}
  - {name: k03, pattern: "/k03/(a|b)*a(a|b){12}c", to: catalog}
  - {name: k04, pattern: "/k04/(a|b)*a(a|b){12}c", to: catalog}
  - {name: k05, pattern: "/k05/(a|b)*a(a|b){12}c", to: catalog}
  - {name: k06, pattern: "/k06/(a|b)*a(a|b){12}c", to: catalog}
