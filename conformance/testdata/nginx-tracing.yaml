# The conformance battery's file for nginx with tracing: nginx-auth.yaml, its services, check, routes and the catalog
# route's limit, with no tls and no client_address key, so the clients speak plain HTTP, forwarded applies as the
# default and a row's own x-request-id reaches the draw that picks the requests traced, and with tracing to the
# collector at 10.0.3.40 at a rate of 5%, with a tag of each source the generator writes: an environment variable with
# a default, the request id, a header with a default and one without, a header whose lines Envoy joins, the check's
# first accept name, a default holding $, " and \, and a tag named like a field of the Envoy output's span. Only the nginx images tagged -otel load the
# tracing module, so only their entries run it, beside Envoy's, which measures its literals. A tracing row sends none
# of its requests to the catalog route, whose bucket the rate limit rows count on.
listen: 10000
admin: 9901
limits:
  request_headers: {size: 60KiB, count: 100}
timeouts:
  idle: 2s
  upstream_idle: 3s
services:
  shop:
    http: 8080
    grpc: 8081
    addresses: ["10.0.1.11", "10.0.1.12"]
  accounts: {grpc: 7070, http: 7070, host_header: "127.0.0.1:7070"}
  catalog: {http: 8090, address: "10.0.2.21"}
auth:
  ask: accounts /auth/check
  timeout: 1500ms
  enabled: true
  when_unavailable: allow
  only_with_header: authorization
  send: [authorization, x-country, x-client-*, http2-settings]
  accept: [x-user-id, x-tier-level, x-user-check]
  send_request: true
remove_from_clients: [x-client-id]
cors: {allow_methods: "*", allow_headers: "*", expose_headers: "Content-Disposition,X-Request-Id", max_age: "600"}
origins:
  live:
    hosts: [api.example.com, api.example.org]
    origins: ["https://example.com", "https://www.example.com"]
    patterns: ["https://*.example.com"]
  test:
    hosts: [api.test.example.com]
    origins: ["http://localhost:3000", "https://test.example.com"]
    patterns: ["https://*.test.example.com"]
  local:
    hosts: [127.0.0.1, localhost]
    origins: []
    patterns: ["http://*.example.com:*", "http://localhost:*"]
  many:
    hosts: [patterns.example.net]
