# The tree proxyfile must generate for examples/partial: the other side of each optional key (no admin listener, the
# default namespace, a check that is off and denies when it cannot be asked, one limit, one timeout, addresses that
# are not the default).
overload_manager:
  refresh_interval: 0.25s
  resource_monitors:
  - name: envoy.resource_monitors.fixed_heap
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.fixed_heap.v3.FixedHeapConfig
      max_heap_size_bytes: 67108864
  actions:
  - name: envoy.overload_actions.shrink_heap
    triggers: [{name: envoy.resource_monitors.fixed_heap, threshold: {value: 0.90}}]
  - name: envoy.overload_actions.stop_accepting_requests
    triggers: [{name: envoy.resource_monitors.fixed_heap, threshold: {value: 0.98}}]
static_resources:
  listeners:
  - name: public
    address: {socket_address: {address: 0.0.0.0, port_value: 8000}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: public
          use_remote_address: false
          always_set_request_id_in_response: true
          server_header_transformation: PASS_THROUGH
          normalize_path: false
          merge_slashes: false
          upgrade_configs: [{upgrade_type: websocket}]
          local_reply_config:
            mappers:
            - filter: {response_flag_filter: {flags: [UF, UH, UC, URX]}}
              status_code: 502
              body: {inline_string: ""}
            - filter:
                and_filter:
                  filters:
                  - status_code_filter:
                      comparison: {op: EQ, value: {default_value: 403, runtime_key: gateway.local_reply.origin_refused_status}}
                  - header_filter:
                      header: {name: origin, present_match: true}
              body: {inline_string: "Invalid CORS request"}
          access_log:
          - name: envoy.access_loggers.stdout
            filter:
              or_filter:
                filters:
                - status_code_filter:
                    comparison: {op: GE, value: {default_value: 500, runtime_key: gateway.request_log.min_status}}
                - response_flag_filter: {}
                - runtime_filter:
                    runtime_key: gateway.request_log.sample
                    percent_sampled: {numerator: 0, denominator: HUNDRED}
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  time: "%START_TIME%"
                  route: "%ROUTE_NAME%"
                  host: "%REQ(:AUTHORITY)%"
                  method: "%REQ(:METHOD)%"
                  protocol: "%PROTOCOL%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  details: "%RESPONSE_CODE_DETAILS%"
                  duration_ms: "%DURATION%"
                  upstream_ms: "%RESPONSE_DURATION%"
                  bytes_in: "%BYTES_RECEIVED%"
                  bytes_out: "%BYTES_SENT%"
                  upstream: "%UPSTREAM_CLUSTER%"
                  request_id: "%REQ(X-REQUEST-ID)%"
                  authz_us: "%FILTER_STATE(envoy.filters.http.ext_authz:FIELD:latency_us)%"
          - name: envoy.access_loggers.stdout
            filter:
              response_flag_filter: {flags: [UH, UF, UO, UC, UT, URX, UPE]}
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  event: gateway_upstream_failure
                  route: "%ROUTE_NAME%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  upstream: "%UPSTREAM_CLUSTER%"
          - name: envoy.access_loggers.stdout
            filter:
              and_filter:
                filters:
                - header_filter:
                    header: {name: x-envoy-auth-failure-mode-allowed, present_match: true}
                - metadata_filter:
                    matcher: {filter: proxyfile, path: [{key: filtered}], value: {bool_match: true}}
                    match_if_key_not_found: false
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  event: gateway_auth_unavailable
                  route: "%ROUTE_NAME%"
                  action: "%METADATA(ROUTE:proxyfile:action)%"
                  status: "%RESPONSE_CODE%"
                  failure_mode_allowed: "%REQ(x-envoy-auth-failure-mode-allowed)%"
                  request_id: "%REQ(X-REQUEST-ID)%"
          early_header_mutation_extensions:
          - name: envoy.http.early_header_mutation.header_mutation
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
              mutations:
              - remove: x-gateway-action
              - remove: x-gateway-reports
              - remove: x-identity
              - remove: x-envoy-auth-failure-mode-allowed
          http_filters:
          - name: envoy.filters.http.set_metadata
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_metadata.v3.Config
              metadata:
              - metadata_namespace: proxyfile
                value: {filtered: true}
          - name: envoy.filters.http.header_mutation
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
              mutations:
                response_mutations:
                - append:
                    header: {key: vary, value: Origin}
                    append_action: APPEND_IF_EXISTS_OR_ADD
          - name: envoy.filters.http.rbac
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              http_service:
                server_uri: {uri: "http://[::1]:4000/check", cluster: identity_http, timeout: 0.25s}
                path_override: /check
                authorization_request:
                  headers_to_add: [{key: x-gateway-timeout-ms, value: "250"}]
                authorization_response:
                  allowed_upstream_headers: {patterns: [{exact: x-identity}]}
              failure_mode_allow: false
              allowed_headers:
                patterns: [{exact: authorization}, {exact: x-gateway-action}, {exact: x-gateway-reports}]
              emit_filter_state_stats: true
              filter_enabled:
                default_value: {numerator: 0, denominator: HUNDRED}
                runtime_key: gateway.ext_authz.enabled
          - name: envoy.filters.http.lua
            disabled: true
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  -- Connect's status today for each code whose status the bridge writes from the old table.
                  local CONNECT_STATUS = {
                    canceled = "499",
                    deadline_exceeded = "504",
                    failed_precondition = "400",
                    unimplemented = "501",
                  }
                  local OLD_STATUS = {["404"] = true, ["408"] = true, ["412"] = true}

                  function envoy_on_response(response_handle)
                    local headers = response_handle:headers()
                    if not OLD_STATUS[headers:get(":status")] or headers:get("content-type") ~= "application/json" then
                      return
                    end
                    local body = response_handle:body()
                    if body == nil then
                      return
                    end
                    -- The bridge writes the error with protobuf's JSON printer: its keys come in no fixed order
                    -- (message before code, as measured), and a quote inside a string is always escaped, so the
                    -- only "code":"..." pair in the body is the error's own.
                    local code = body:getBytes(0, body:length()):match('"code"%s*:%s*"([%l_]+)"')
                    local status = CONNECT_STATUS[code]
                    if status ~= nil then
                      -- Asked for again: the header object from before body() died while the body was awaited.
                      response_handle:headers():replace(":status", status)
                    end
                  end
          - name: envoy.filters.http.connect_grpc_bridge
            disabled: true
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.connect_grpc_bridge.v3.FilterConfig
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: true
          route_config:
            name: public
            request_headers_to_remove: [x-gateway-action, x-gateway-reports]
            ignore_port_in_host_matching: true
            virtual_hosts:
            - name: only
              domains: [gateway.example.net]
              typed_per_filter_config:
                envoy.filters.http.rbac:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                  rbac:
                    rules:
                      action: ALLOW
                      policies:
                        browser-origins:
                          permissions: [{any: true}]
                          principals:
                          - {not_id: {header: {name: origin, present_match: true}}}
                          - {header: {name: origin, string_match: {safe_regex: {regex: '^https?://gateway\.example\.net(:[0-9]+)?$'}}}}
                          - {header: {name: origin, string_match: {exact: "https://app.example.net", ignore_case: true}}}
                envoy.filters.http.cors:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  allow_origin_string_match:
                  - {exact: "https://app.example.net", ignore_case: true}
                  forward_not_matching_preflights: false
              routes:
              - name: backend-rpc
                match: {path: /example.backend.v1.ReportService/ListReports}
                metadata: {filter_metadata: {proxyfile: {action: read}}}
                typed_per_filter_config:
                  envoy.filters.http.header_mutation:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute
                    mutations:
                      request_mutations:
                      - append: {header: {key: x-gateway-action, value: read}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}
                      - append: {header: {key: x-gateway-reports, value: "export,share"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}
                  envoy.filters.http.connect_grpc_bridge: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}
                  envoy.filters.http.lua: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}
                route: {cluster: backend_grpc, timeout: 30s}
              - name: login
                match: {path: /login, headers: [{name: ":method", string_match: {exact: POST}}]}
                route: {cluster: identity_http, prefix_rewrite: /session, timeout: 30s}
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true
              - name: web
                match: {prefix: /}
                metadata: {filter_metadata: {proxyfile: {action: ""}}}
                route: {cluster: web_http, timeout: 30s}
  clusters:
  - name: web_http
    type: STATIC
    load_assignment:
      cluster_name: web_http
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 10.0.0.5, port_value: 3000}}}}]}]
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http_protocol_options: {}}
  - name: identity_http
    type: STATIC
    load_assignment:
      cluster_name: identity_http
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: "::1", port_value: 4000}}}}]}]
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http_protocol_options: {}}
  - name: backend_grpc
    type: STATIC
    load_assignment:
      cluster_name: backend_grpc
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 5000}}}}]}]
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
