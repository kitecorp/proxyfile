syntax = "proto3";

package o.v1;

import "google/protobuf/descriptor.proto";

message Route {
  string action = 1;
  repeated string reports = 2;
}

extend google.protobuf.MethodOptions {
  Route route = 50000;
}

// Each method but Tab holds a control character in its action or in a report, which no value may hold; a tab is read.
service S {
  rpc Newline(Empty) returns (Empty) {
    option (o.v1.route) = {action: "a\nb"};
  }
  rpc Return(Empty) returns (Empty) {
    option (o.v1.route) = {action: "a\rb"};
  }
  rpc Nul(Empty) returns (Empty) {
    option (o.v1.route) = {action: "a\000b"};
  }
  rpc Other(Empty) returns (Empty) {
    option (o.v1.route) = {action: "read", reports: ["export", "c\001d"]};
  }
  rpc Tab(Empty) returns (Empty) {
    option (o.v1.route) = {action: "a\tb"};
  }
}

message Empty {}
