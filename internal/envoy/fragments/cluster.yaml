# One cluster per port of a service, and one each for the OpenTelemetry collector and the keys URL of auth.jwt, which
# take none of a service's own settings (extraCluster in generate.go). A STATIC cluster names each backend by its IP
# address and looks up no name (Envoy 1.40.2, service_discovery.rst, "Static"). A STRICT_DNS cluster looks its name up
# again every 5 seconds (cluster.proto, dns_refresh_rate, whose default is 5000 ms) and takes every address the answer
# gives as a backend (service_discovery.rst, "Strict DNS"). balance hash writes its hash policy on the cluster, not on
# each route: Envoy 1.40.2 reads a cluster's hash policy before a route's (source/common/router/router.h lines 350 to
# 357, "Use cluster-level hash policy if available"; api/envoy/extensions/upstreams/http/v3/http_protocol_options.proto
# lines 189 to 202, field 10), so every route to the service hashes alike.
name: {{q .Name}}
type: {{if .DNS}}STRICT_DNS{{else}}STATIC{{end}}
{{- if .DNS}}
# The lookup returns the name's IPv4 and IPv6 addresses both (cluster.proto, DnsLookupFamily ALL), and each is a
# backend. Without the line Envoy asks for IPv6 addresses first and for IPv4 ones only when the name has none (AUTO,
# the default). Measured on Envoy 1.40.2 with a name that has one address of each kind: with ALL it gives two
# backends, each checked on its own and each taking requests; with the default it gives the IPv6 one alone, so a
# backend that listened on IPv4 only got no request.
dns_lookup_family: ALL
{{- end}}
{{- with .LBPolicy}}
lb_policy: {{.}}
{{- end}}
{{- with .Resolver}}
# dns.resolver: c-ares asks this name server instead of the host's resolver configuration (cares_dns_resolver.proto,
# resolvers). typed_dns_resolver_config replaces the deprecated dns_resolvers (cluster.proto).
typed_dns_resolver_config:
  name: envoy.network.dns_resolver.cares
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig
    resolvers: [{socket_address: {address: {{q .Address}}, port_value: {{.Port}}}}]
{{- end}}
load_assignment:
  cluster_name: {{q .Name}}
  endpoints: [{lb_endpoints: [{{range $i, $address := .Addresses}}{{if $i}}, {{end}}{endpoint: {address: {socket_address: {address: {{q $address}}, port_value: {{$.Port}}}}}}{{end}}]}]
{{- with .Health}}
# health: one active check per backend (health_check.proto). Measured on Envoy 1.40.2: no_traffic_interval equal to
# interval, because without it a newly started proxy checks once and not again for 60 s; on the HTTP check,
# retriable_statuses over every status, because without it a single failed check removes a backend at once, while
# with it a backend leaves after unhealthy failed checks in a row and expected_statuses still decides which status
# passes. The gRPC check has no retriable_statuses (Envoy refuses the field). With host_header the check sends that
# Host, as the HTTP check's host and the gRPC check's authority.
health_checks:
- timeout: {{.Timeout}}
  interval: {{.Interval}}
  no_traffic_interval: {{.Interval}}
  healthy_threshold: {{.Healthy}}
  unhealthy_threshold: {{.Unhealthy}}
{{- if .GRPC}}
  grpc_health_check: {{if .Host}}{authority: {{q .Host}}}{{else}}{}{{end}}
{{- else}}
  http_health_check: {path: {{q .Path}}, expected_statuses: [{start: 200, end: 300}], retriable_statuses: [{start: 100, end: 600}]{{with .Host}}, host: {{q .}}{{end}}}
{{- end}}
# Envoy's default panic threshold of 50% sends requests to failed backends again once fewer than half are healthy
# (cluster.proto, CommonLbConfig; measured on Envoy 1.40.2: with the default, every request went to the one failed
# backend). So the threshold is 0, and then a service whose every backend failed gets no request, and the listener's
# mapper of upstream failures answers 502.
common_lb_config: {healthy_panic_threshold: {value: 0}}
{{- end}}
{{- if and .Health .DNS}}
# Without it a backend that leaves the name's answer stays in the pool for as long as it passes its checks
# (cluster.proto, ignore_health_on_host_removal; measured on Envoy 1.40.2).
ignore_health_on_host_removal: true
{{- end}}
{{- with .Connections}}
# The circuit breakers take limits.connections, where Envoy's defaults of 1,024 would refuse load a service takes
# (circuit_breaker.proto, Thresholds).
circuit_breakers: {thresholds: [{max_connections: {{.Number}}, max_pending_requests: {{.Number}}, max_requests: {{.Number}}}]}
{{- end}}
{{- with .TLS}}
# The keys URL is fetched over TLS, and its server's certificate must chain to the CA bundle of auth.jwt.ca and name
# the URL's host. Both are written because neither alone is enough, as measured on Envoy 1.40.2: system_root_certs in
# place of trusted_ca is accepted on Linux and then verifies nothing (a self-signed server passed), and trusted_ca
# without match_typed_subject_alt_names accepts a certificate issued for another host. A host name is also sent as the
# server name (sni); an IP address is not, because RFC 6066 section 3 allows no IP address there, and it is matched as
# an IP_ADDRESS name.
transport_socket:
  name: envoy.transport_sockets.tls
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
{{- with .SNI}}
    sni: {{q .}}
{{- end}}
    common_tls_context:
      validation_context:
        trusted_ca: {filename: {{q .CA}}}
        match_typed_subject_alt_names: [{san_type: {{.SANType}}, matcher: {exact: {{q .SAN}}}}]
{{- end}}
typed_extension_protocol_options:
  envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
    "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
{{- with .HashHeader}}
    # A request without the header gets no hash and goes to a backend chosen at random (route_components.proto,
    # HashPolicy).
    hash_policy: [{header: {header_name: {{q .}}}}]
{{- end}}
{{- if .HashClient}}
    # hash.client hashes the address the connection manager takes as the client's (source/common/http/hash_policy.cc,
    # the downstream remote address).
    hash_policy: [{connection_properties: {source_ip: true}}]
{{- end}}
{{- with .UpstreamIdle}}
    # Envoy 1.40.2: HttpProtocolOptions.common_http_protocol_options is config.core.v3.HttpProtocolOptions, whose
    # idle_timeout closes a connection with no active request after that long (default 1 hour). timeouts.upstream_idle
    # should sit under the service's own idle timeout, so the gateway closes an idle connection before the service
    # does and never sends a request on one the service is closing. For the auth service's cluster this matters most:
    # a check sent on a connection the service is closing fails, and with when_unavailable: allow its request goes
    # through marked.
    common_http_protocol_options: {idle_timeout: {{.}}}
{{- end}}
    # A grpc port is spoken as HTTP/2 without TLS (h2c), an http port as HTTP/1.1. A cluster without a transport socket,
    # every one but the keys URL's, speaks plaintext (cluster.proto, Cluster.transport_socket).
    explicit_http_config: {{if .HTTP2}}{http2_protocol_options: {}}{{else}}{http_protocol_options: {}}{{end}}
