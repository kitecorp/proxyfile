# Where a route sends a request, plain and RPC routes alike. A route keeps the client's Host unless its service has
# host_header. Without timeouts.request a route has Envoy's default total timeout of 15 s, counted from the end of the
# request, and with timeouts.request: none it has none (route_components.proto, RouteAction.timeout); a WebSocket's
# request never ends, so only the idle timeout reaches it. retries: retried only on connect-failure and
# reset-before-request, so a request is sent again only when it never reached the service (router_filter.rst,
# x-envoy-retry-on).
#
# A retry picks its backend as the first try did (Envoy 1.40.2, http_connection_management.rst, "Retry plugin
# configuration"), so it could go to the backend that just refused the connection. The previous_hosts predicate
# "rejects hosts that have already been attempted" (the same section, PreviousHostsPredicate; its name,
# envoy.retry_host_predicates.previous_hosts, in previous_hosts.proto and the factory's config.h), and Envoy picks
# again, at most host_selection_retry_max_attempts times, then sends the retry to the last backend it picked
# (route_components.proto, RetryPolicy.retry_host_predicate and RetryPolicy.host_selection_retry_max_attempts), so a
# service with one backend is still retried on it. The count is 20 because a new pick can be a backend already tried:
# least_requests and random draw each pick anew, so with two backends and one refusing connections each pick finds
# the refusing one about half the time, and hash takes the next entry along its ring, the same entries for a value
# every time. Measured on Envoy 1.40.2: with random, 1000 requests for each count from 1 to 8, each count about halved
# the share of retries that still failed, from 24.8% to 0.19%; with hash on a header, the 87 of 200 values that hashed
# to the refusing backend all passed at 6 and not before. At 6, the smallest count at which 200 requests in a row were
# all answered 200 for every balance, random still failed 3 of 1000. At 20, by that halving, fewer than one in a
# million fail with random, and 5000 requests for each balance were all answered by the other backend. A pick costs no
# request, only a draw or a step in memory, and only a retry that picks a backend already tried makes another.
{cluster: {{q .Cluster}}
{{- with .HostRewrite}}, host_rewrite_literal: {{q .}}{{end}}
{{- with .PrefixRewrite}}, prefix_rewrite: {{q .}}{{end}}
{{- with .Timeout}}, timeout: {{.}}{{end}}
{{- with .IdleTimeout}}, idle_timeout: {{.}}{{end}}
{{- with .Retries}}, retry_policy: {retry_on: "connect-failure,reset-before-request", num_retries: {{.}},
  retry_host_predicate: [{name: envoy.retry_host_predicates.previous_hosts,
    typed_config: {"@type": type.googleapis.com/envoy.extensions.retry.host.previous_hosts.v3.PreviousHostsPredicate}}],
  host_selection_retry_max_attempts: 20}{{end -}}
}
