# One route per RPC method, listed in rpc.methods or in the --rpc-methods file, matched on the exact path a call carries
# (/<package>.<Service>/<Method>), asking the auth check the method's action and reports through the x-gateway- headers
# its own header_mutation entry adds; its metadata keeps the action for the auth-unavailable log line, and with a limit
# on the rpc entry the entry's bucket, under the rate-limit namespace (filter-local-ratelimit.yaml). With
# envoy.connect_bridge, each turns on the bridge, which turns the call into gRPC before the router, and the Lua filter
# that sets Connect's current status on the bridge's errors: a FilterConfig entry turns on, for its route, a filter the
# listener's list writes as disabled (Envoy 1.40.2, http_filters.rst, "Disabled flag based route filter chain"). Without
# the bridge a route with no question carries no typed_per_filter_config at all. With OpenTelemetry the decorator names
# the route's span after the route, where Envoy's own name is ingress (measured on Envoy 1.40.2). propagate: false keeps
# the name out of the answer: with Envoy's default of true every response carries the route's name in
# x-envoy-decorator-operation (measured on Envoy 1.40.2). With X-Ray or no tracing a route carries none.
#
# Written in flow style, so the generated file holds each RPC route on one line.
{
  name: {{q .Name}},
  match: {path: {{q .Path}}},
{{- if or .Auth .RateLimit}}
  metadata: {filter_metadata: { {{- if .Auth}}{{q .Namespace}}: {action: {{q .Action}}}{{end}}
{{- if and .Auth .RateLimit}}, {{end}}
{{- with .RateLimit}}{{q .Namespace}}: { {{- .By}}: {{q .ID}}}{{end -}}
  }},
{{- end}}
{{- with .Decorator}}
  decorator: {operation: {{q .}}, propagate: false},
{{- end}}
{{- $question := and .Auth (or .Action .Reports)}}
{{- if or $question .Bridge}}
  typed_per_filter_config: {
{{- if $question}}
    envoy.filters.http.header_mutation: {
      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutationPerRoute,
      mutations: {request_mutations: [
{{- with .Action}}
        {append: {header: {key: x-gateway-action, value: {{q .}}}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}}
{{- end}}
{{- if and .Action .Reports}},{{end}}
{{- with .Reports}}
        {append: {header: {key: x-gateway-reports, value: {{q .}}}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}}
{{- end}}
      ]}
    }{{if .Bridge}},{{end}}
{{- end}}
{{- if .Bridge}}
    envoy.filters.http.connect_grpc_bridge: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}},
    envoy.filters.http.lua: {"@type": type.googleapis.com/envoy.config.route.v3.FilterConfig, config: {}}
{{- end}}
  },
{{- end}}
  route: $action
}
