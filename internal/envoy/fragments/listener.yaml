# The one listener every request enters by, and its HTTP connection manager. Envoy 1.40.2 references below are to
# its source tree and API files.
name: public
# 0.0.0.0, so a container runtime can publish the port; who may reach it is the network's rule, not the gateway's.
address: {socket_address: {address: 0.0.0.0, port_value: {{.Port}}}}
filter_chains:
- filters:
  - name: envoy.filters.network.http_connection_manager
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
      stat_prefix: public
      # client_address. With forwarded (false), a proxy stands in front: X-Forwarded-For passes as it came and
      # X-Forwarded-Proto is kept when present. With xff_num_trusted_hops at 0, Envoy takes the last X-Forwarded-For
      # entry, the address the proxy in front appended, as the client's address. Without use_remote_address,
      # conn_manager_utility.cc takes the address from the X-Forwarded-For detection, which appends nothing
      # (skip_xff_append defaults to true, xff.cc), and sets X-Forwarded-Proto only when the request has none. With
      # connection (true), Envoy takes the peer of the connection as the client's address, appends it to
      # X-Forwarded-For, sets X-Forwarded-Proto from the connection, and on a request it counts as external replaces
      # the client's x-request-id and removes its x-envoy- headers (Envoy's HTTP header manipulation page,
      # configuration/http/http_conn_man/headers). Measured on Envoy 1.40.2: with true a client's own X-Forwarded-For
      # does not change its address; with false it does.
      use_remote_address: {{.RemoteAddress}}
      # Every response carries the x-request-id the request log writes as request_id, so a caller can quote the id of
      # a failed call. It is the client's own when it sent one, unless use_remote_address is true and the request is
      # external: Envoy replaces a client's x-request-id only on an edge request (conn_manager_utility.cc,
      # request_id/uuid/config.cc).
      always_set_request_id_in_response: true
{{- if .Tracing}}
      # With tracing, Envoy's default request id extension writes its trace decision into the 13th hex digit of
      # x-request-id, a client's own id included (uuid.proto lines 26 to 29). The X-Ray tracer ignores that decision
      # (xray_tracer_impl.cc line 79), so pack_trace_reason: false costs the trace nothing and keeps the id as the
      # client sent it or Envoy generated it. The OpenTelemetry tracer follows the decision, and sample.rate was
      # measured with this setting on Envoy 1.40.2: 100% traced 100 of 100 requests, 0% none, and 5% traced 7, a
      # random draw. The request log's sample reads the id's first eight hex digits, which the
      # setting does not touch: the access log's runtime filter reads the id as a number through the stream id provider
      # (access_log_impl.cc lines 141 to 151), and that number never reads the setting (request_id/uuid/config.cc lines
      # 61 to 77; the setting stops the writes, lines 41 and 103 to 107, and the trace reason read from the id, lines 83
      # to 85, neither of which the number uses), though uuid.proto lines 38 to 42 say stable access log sampling stops.
      request_id_extension:
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.request_id.uuid.v3.UuidRequestIdConfig
          pack_trace_reason: false
      tracing: $tracing
{{- end}}
      # The service's own Server header passes through, and Envoy adds none of its own.
      server_header_transformation: PASS_THROUGH
{{- with .RequestHeaders}}
      # Set above the service's own limits, so the service answers its own 400 to a header block it refuses; Envoy's
      # defaults are 60 KiB and 100 fields (http_connection_manager.proto, max_request_headers_kb; protocol.proto,
      # max_headers_count), and Envoy itself refuses a request over them, with 431 or a stream reset.
      max_request_headers_kb: {{.KiB}}
      common_http_protocol_options: {max_headers_count: {{.Count}}}
{{- end}}
      # Every file normalises the request's path before anything reads it: dot segments are resolved, repeated slashes
      # merged and escaped slashes unescaped, so the route, a rate limit, the token, the check and the service all read
      # the path the service receives. Without these three settings /open/../private/report.txt,
      # /open/%2e%2e/private/report.txt and /open/..%2fprivate/report.txt took a route with prefix /open/ and auth off
      # and reached the service with no token and no check; with them each is answered 401 and reaches no service
      # (measured on Envoy 1.40.2). A ; parameter on a name and the case of letters are kept as sent, a ; parameter on a
      # dot segment written with dots is dropped with the segment resolved, and a backslash or %5C is read as /
      # (measured on Envoy 1.40.2; route-refused.yaml says from which Envoy and under which runtime setting). A dot
      # segment with a ; parameter, the ; written or escaped once, that is still in the path is refused by the first
      # route of every virtual host (route-refused.yaml).
      normalize_path: true
      merge_slashes: true
      path_with_escaped_slashes_action: UNESCAPE_AND_FORWARD
      # WebSocket is the one upgrade passed on. Envoy answers any other Upgrade to a route with 403 and an empty body
      # before any http filter sees the request; one no route takes goes through the filters like any request
      # (conn_manager_impl.cc, which refuses the upgrade only when a route matched).
      upgrade_configs: [{upgrade_type: websocket}]
      local_reply_config:
        mappers:
        # A service that cannot be reached answers 502 with an empty body, where Envoy's own answer is a 503 (or a
        # 502) with a body that describes the failure (router.cc).
        - filter: {response_flag_filter: {flags: [UF, UH, UC, URX]}}
          status_code: 502
          body: {inline_string: ""}
        # The RBAC filter's refusal of a browser origin, with the body a Spring service gives for it (403 "Invalid
        # CORS request"). The refusal sets no response flag (rbac_filter.cc), so the match is a 403 to a request that
        # carries an Origin: the RBAC rules let every request without one through, and a 403 Envoy answers for
        # anything else without an Origin (an Upgrade to a route that does not proxy it) keeps its empty body.
        - filter:
            and_filter:
              filters:
              - status_code_filter:
                  comparison: {op: EQ, value: {default_value: 403, runtime_key: gateway.local_reply.origin_refused_status}}
              - header_filter:
                  header: {name: origin, present_match: true}
          body: {inline_string: "Invalid CORS request"}
{{- if .Auth}}
        # ext_authz in HTTP mode lets a request through only on 200 and has no setting to widen it: a check's other
        # 2xx refuses the request, and without this mapper the client receives that 2xx, a success for a request that
        # never reached the service. ext_authz marks its answers with the UAEX flag, so a 2xx it passes on is
        # answered 403 with the check's body (measured on Envoy 1.40.2: a check's 202 and 204 give 403, and its 200
        # and 401 stay as they were).
        - filter:
            and_filter:
              filters:
              - response_flag_filter: {flags: [UAEX]}
              - status_code_filter: {comparison: {op: GE, value: {default_value: 200}}}
              - status_code_filter: {comparison: {op: LE, value: {default_value: 299}}}
          status_code: 403
{{- end}}
{{- if .RateLimit}}
{{- if .Auth}}
        # The first mapper that matches wins. This one changes nothing and matches every other answer of the auth
        # check (ext_authz marks them UAEX), so a refusal the check wrote stays as it wrote it. It comes after the 2xx
        # mapper above, so a check's other 2xx still becomes 403, and before the Connect answer below, so a 429 the
        # check answers to a Connect call keeps the check's body, not the rate limit's (measured on Envoy 1.40.2).
        - filter: {response_flag_filter: {flags: [UAEX]}}
{{- end}}
        # A Connect client reads Envoy's plain 429 to a request over a rate limit as unavailable, so a 429 to a request
        # that carries connect-protocol-version gets the Connect error resource_exhausted instead. The Connect-gRPC bridge
        # removes that header, which is why the rate limit filter runs before it. Measured on Envoy 1.40.2: a Connect
        # call gets this answer, a mapper on the RL response flag never matches, and the check's own answers, the CORS
        # refusal and the 502 of an unreachable service stay as they were. Not measured: a Connect GET call carries no
        # such header and keeps the plain 429, and a Connect stream reads its error from the body of a 200 answer, so it
        # reads either 429 as unavailable (the Connect protocol).
        - filter:
            and_filter:
              filters:
              - status_code_filter:
                  comparison: {op: EQ, value: {default_value: 429, runtime_key: gateway.local_reply.rate_limited_status}}
              - header_filter:
                  header: {name: connect-protocol-version, present_match: true}
          body: {inline_string: '{"code":"resource_exhausted","message":"local_rate_limited"}'}
          body_format_override:
            text_format_source: {inline_string: "%LOCAL_REPLY_BODY%"}
            content_type: application/json
{{- end}}
      access_log: $access_log
{{- if or .Removed .Auth .Downstream}}
      # These headers are removed before routing and before every filter, so no route, filter or service sees a
      # client's copy, in this order: the names in remove_from_clients; with auth.ask, the question headers
      # x-gateway-action and x-gateway-reports and each accept name; with auth.jwt, each claims header; each of these
      # unless an entry before it already covers it (an exact entry equal to it, or a prefix entry it starts with); with
      # auth.ask, Envoy's mark x-envoy-auth-failure-mode-allowed; with tracing, x-envoy-downstream-service-cluster and
      # x-envoy-downstream-service-node; and with otel, x-envoy-decorator-operation, which would rename the span; each
      # of the last three unless an entry before it covers it (downstreamRemoved in generate.go).
      # The question headers, the accept headers and the claims headers are removed whether or not
      # remove_from_clients lists them, because a client must not be able to forge what the gateway asks the check,
      # what the check says or what the token says (removedFromClients in generate.go builds the list). Envoy 1.40.2,
      # http_connection_manager.proto: early_header_mutation_extensions "will be called before any routing, tracing, or
      # any filter processing"; the extension's mutations are config.common.mutation_rules.v3.HeaderMutation (remove,
      # remove_on_match). The extension is left out when there is nothing to remove, because it needs at least one
      # mutation (header_mutation.proto, min_items 1).
      early_header_mutation_extensions:
      - name: envoy.http.early_header_mutation.header_mutation
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
          mutations:
{{- range .Removed}}
{{- if .Prefix}}
          - remove_on_match: {key_matcher: {prefix: {{q .Name}}}}
{{- else}}
          - remove: {{q .Name}}
{{- end}}
{{- end}}
{{- if .Auth}}
          - remove: x-envoy-auth-failure-mode-allowed
{{- end}}
{{- range .Downstream}}
          - remove: {{.}}
{{- end}}
{{- end}}
      http_filters: $http_filters
      route_config:
        name: public
{{- if .Auth}}
        # The route's question is for the auth check alone: the router removes it, after every filter, so no service
        # sees it (router.cc, finalizeRequestHeaders).
        request_headers_to_remove: [x-gateway-action, x-gateway-reports]
{{- end}}
        # One virtual host per environment of the origins, written in the proxyfile or in an origins file, so each
        # admits its own browser origins. The port in Host plays no part, so a local setup may reach the gateway on any
        # port.
        ignore_port_in_host_matching: true
        virtual_hosts: $virtual_hosts
{{- if .TLS}}
  # With tls the listener serves HTTPS on the same port (transport-socket-tls.yaml).
  transport_socket: $transport_socket
{{- end}}
