# It answers itself every preflight to a route that reaches it, which is every preflight RBAC admits: RBAC, the filter
# before it, refuses one from a foreign origin, and each virtual host sets forward_not_matching_preflights to false, so
# a preflight from an origin on one of the environment's own hosts, which RBAC admits and the CORS list does not hold,
# is answered too, with no Access-Control-Allow-Origin. So none reaches a service or ext_authz. On every other answer
# to an origin its list holds it sets Access-Control-Allow-Origin and, when cors sets expose_headers,
# Access-Control-Expose-Headers, replacing any the service sent (Envoy 1.40.2, cors_filter.cc); an origin the list
# does not hold gets neither, also when it is the request's own host and port. The policy is per virtual host. Its
# max_age lets a browser cache an admitted preflight, so an origin taken off its environment's list may keep working
# that long in a browser that cached its preflight.
name: envoy.filters.http.cors
typed_config:
  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
